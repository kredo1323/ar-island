<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1b1b1f">
    <title>AR Island - Kiiz Uy</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1b1f;
                   font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4efe3; touch-action: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
                background: radial-gradient(circle at 50% 35%, #2c4a6e, #1b1b1f 70%); z-index: 5; text-align: center; padding: 24px; }
      #loader h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
      #loader p { margin: 0; opacity: .8; max-width: 420px; line-height: 1.4; }
      #bar { width: min(320px, 70vw); height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #e0b03c; transition: width .2s; }
      #warn { display: none; color: #ffb4a8; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <h1>Киіз үй · AR</h1>
      <p>Загрузка… Затем разреши доступ к камере и наведи её на открытку.</p>
      <div id="bar"><div id="fill"></div></div>
      <p id="warn"></p>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warn = document.querySelector("#warn");
      if (!window.isSecureContext) {
        warn.style.display = "block";
        warn.textContent = "Камера работает только по HTTPS (или localhost). Откройте страницу по https://…";
      }
      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "AR Island",
        productName: "AR Island - Kiiz Uy",
        productVersion: "1.0",
        // cap the render resolution on high-DPI phones: the tracker, not the pixels, is the bottleneck
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loader").style.display = "none";
        }).catch(function (message) {
          warn.style.display = "block";
          warn.textContent = "Ошибка загрузки: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
